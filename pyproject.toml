[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intersectional-bias-audit"
version = "1.0.0"
description = "Intersectional fairness audit of UCI Adult income prediction across Gender x Race x Age subgroups"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sarthak Doshi" }]
keywords = ["fairness", "intersectionality", "bias-audit", "disparate-impact", "uci-adult"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
bias-audit = "bias_audit.cli:main"

[project.urls]
Repository = "https://github.com/SdSarthak/intersectional-bias-audit"

[tool.setuptools]
packages = ["bias_audit"]
